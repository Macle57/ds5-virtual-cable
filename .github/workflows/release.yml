# Release pipeline: push a tag `vX.Y.Z`, get a GitHub release carrying ONE
# installer -- ds5bridge-setup-<version>-bundled.exe -- and its SHA256SUMS.
#
# The contract with the rest of the system, spelled out because three
# consumers depend on it exactly:
#
#   * The tag MUST equal `v` + ds5app.__version__ (app/ds5app/__init__.py --
#     the single source of truth; cli.py, the updater and build-installer.ps1
#     all read it). The first job fails the release on a mismatch, because a
#     v0.5.0 release containing an exe that says 0.4.0 would make every
#     installed copy offer itself its own "update" forever.
#   * The installer is named  ds5bridge-setup-<version>-bundled.exe  and
#     carries usbip-win2 0.9.7.7 and HidHide 1.5.230 inside it, unmodified
#     (app/packaging/build-installer.ps1 -Bundle; the name is ds5bridge.iss's
#     OutputName define -- checked here, never invented). It is THE install:
#     scripts/install.ps1 downloads and runs it, and app/ds5app/update.py
#     downloads and runs it silently for an in-place update. Both match the
#     name with an anchored regex (`^ds5bridge-setup-[0-9].*-bundled\.exe$`),
#     so the download-mode exe and the old one-dir zip -- neither published
#     any more (build-installer.ps1 can still build the download flavour
#     locally) -- could never be picked up by mistake if one reappeared.
#   * SHA256SUMS is `sha256sum` format ("<hex>  <name>"), one line per asset.
#     install.ps1 and update.py refuse an installer that does not match it --
#     a release without it downgrades them to size-only checks, so it is
#     generated here, not by hand. Nothing is code-signed (docs/installer.md),
#     so the published hash is also the only thing a person can check a
#     download against.
#
# Why Inno Setup is pinned to 6.7.3 and fetched from its own GitHub release
# rather than `choco install innosetup`: the installer was verified with
# 6.7.3 (docs/installer-handoff.md), Chocolatey tracks the latest major
# (7.x now), and a compiler upgrade in the middle of a release is not a
# thing to discover on the release page. The hash is the one in winget's
# manifest for JRSoftware.InnoSetup 6.7.3 and was re-measured on 2026-09-05.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # gh release create

defaults:
  run:
    shell: pwsh

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tag must match ds5app.__version__
        run: |
          $tag = '${{ github.ref_name }}'
          $init = Get-Content app/ds5app/__init__.py -Raw
          if ($init -notmatch '__version__\s*=\s*"([^"]+)"') {
            throw 'no __version__ in app/ds5app/__init__.py'
          }
          $ver = $Matches[1]
          if ($tag -ne "v$ver") {
            throw "tag '$tag' does not match ds5app.__version__ '$ver' -- bump app/ds5app/__init__.py (the single source of truth) and re-tag."
          }
          "version=$ver" | Out-File $env:GITHUB_OUTPUT -Append
        id: version

      # build.ps1 insists on this exact venv path, and that is a feature: the
      # release build runs the same script a developer runs, not a parallel
      # recipe that can drift from it.
      - name: Create the build venv
        run: |
          python -m venv prototype\.venv
          prototype\.venv\Scripts\python.exe -m pip install --upgrade pip
          prototype\.venv\Scripts\python.exe -m pip install hidapi numpy av pystray pillow pyinstaller

      # No release from a red tree. The app tests include the updater's
      # decision logic -- the code that will evaluate THIS release's JSON.
      - name: Unit tests (emulator + app, no hardware)
        run: |
          Push-Location emulator
          ..\prototype\.venv\Scripts\python.exe -m unittest discover -s tests -t . -v
          Pop-Location
          Push-Location app
          ..\prototype\.venv\Scripts\python.exe -m unittest discover -s tests -t . -v
          Pop-Location

      - name: Build (one-dir, via the same script developers use)
        run: powershell -File app\packaging\build.ps1

      # The smoke test that catches a broken bundle before users do: the
      # frozen exe must at least start and answer --version with the version
      # this release claims to be. Before the installer is built, because
      # build-installer.ps1 embeds exactly this folder. (The console exe: the
      # tray exe carries requireAdministrator and would want UAC.)
      - name: Frozen exe answers --version
        run: |
          $ver = '${{ steps.version.outputs.version }}'
          $out = & dist\ds5bridge\ds5bridge.exe --version
          "exe says: $out"
          if ("$out" -notmatch [regex]::Escape($ver)) {
            throw "the built exe reports '$out', expected it to contain '$ver'"
          }

      - name: Install Inno Setup 6.7.3 (pinned, SHA-256 checked)
        run: |
          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe'
          $sha = '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732'
          $exe = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest -Uri $url -OutFile $exe -UseBasicParsing
          $got = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $sha) { throw "innosetup-6.7.3.exe: SHA-256 $got, expected $sha -- not installing it" }
          $p = Start-Process -FilePath $exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/ALLUSERS' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "the Inno Setup installer exited with $($p.ExitCode)" }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe is not at $iscc after the install" }
          "ISCC: $iscc"

      # -Bundle fetches the two vendor installers from their pinned URLs and
      # refuses to embed either unless its SHA-256 matches the pin and its
      # Authenticode signature is valid.
      - name: Build the installer (bundled)
        run: |
          powershell -File app\packaging\build-installer.ps1 -Bundle -OutputDir dist\bundle
          if ($LASTEXITCODE -ne 0) { throw "bundled installer build failed ($LASTEXITCODE)" }

      # A cheap check that the exe is what its name says. It is not run:
      # installing kernel drivers on the runner would prove nothing about a
      # user's machine, and the install paths were verified by hand
      # (docs/installer-handoff.md).
      - name: The bundled installer exists and carries the drivers
        run: |
          $ver = '${{ steps.version.outputs.version }}'
          $bundled = Get-Item "dist\bundle\ds5bridge-setup-$ver-bundled.exe"
          "bundled: $($bundled.Length) bytes"
          # The app alone compresses to ~39 MiB and the two vendor installers
          # (33 MB + 8 MB) add ~34 MiB (measured 2026-09-05: 72.9 MiB in
          # total). Anything under 60 MiB did not embed them.
          if ($bundled.Length -lt 60MB) {
            throw 'the bundled exe is smaller than 60 MiB -- the vendor installers are missing from it'
          }

      - name: Checksum
        run: |
          $ver = '${{ steps.version.outputs.version }}'
          Move-Item "dist\bundle\ds5bridge-setup-$ver-bundled.exe" dist\
          Push-Location dist
          # sha256sum format, two spaces: what update.py's parser,
          # install.ps1 and plain `sha256sum -c` all read. Bare file names,
          # as the release page will show them.
          $a = "ds5bridge-setup-$ver-bundled.exe"
          $hash = (Get-FileHash $a -Algorithm SHA256).Hash.ToLower()
          "$hash  $a" | Out-File SHA256SUMS -Encoding ascii
          Get-Content SHA256SUMS
          Pop-Location

      # A single-quoted here-string (no expansion: markdown backticks would
      # otherwise be PowerShell escapes), with the version substituted after.
      - name: Write the release notes header
        run: |
          $ver = '${{ steps.version.outputs.version }}'
          $notes = @'
          ## Install

          Download **`ds5bridge-setup-VERSION-bundled.exe`** and run it -- that is the whole install. It carries usbip-win2 0.9.7.7 and HidHide 1.5.230 inside it (nothing is downloaded during the install), installs the app, verifies everything and shows the result. Or, from PowerShell:

          ```powershell
          irm https://raw.githubusercontent.com/Macle57/ds5-virtual-cable/main/scripts/install.ps1 | iex
          ```

          which downloads this same file, checks it against `SHA256SUMS`, and runs it.

          | file | what it is |
          |---|---|
          | `ds5bridge-setup-VERSION-bundled.exe` | The installer. Also what the app's in-place updater downloads. |
          | `SHA256SUMS` | Its SHA-256. Nothing here is code-signed, so this is how to check the download. |

          Nothing is code-signed yet: Windows SmartScreen shows "Windows protected your PC" on first run (*More info* > *Run anyway*). The tray runs as administrator (one UAC prompt when you start it by hand; none at login). Uninstalling removes the drivers in two halves around **one reboot**; reboot **twice** before reinstalling usbip-win2 (docs/installer.md).

          '@
          $notes.Replace('VERSION', $ver) | Out-File dist\notes.md -Encoding utf8

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = '${{ steps.version.outputs.version }}'
          gh release create '${{ github.ref_name }}' `
            "dist/ds5bridge-setup-$ver-bundled.exe" `
            "dist/SHA256SUMS" `
            --title "ds5bridge $ver" `
            --notes-file dist/notes.md `
            --generate-notes `
            --verify-tag
