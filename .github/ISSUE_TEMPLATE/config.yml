# GitHub requires absolute URLs in contact_links, so the first one names the
# repository explicitly; update it if the repository is ever renamed.
blank_issues_enabled: true
contact_links:
  - name: Read the handoff document first
    url: https://github.com/Macle57/ds5-virtual-cable/blob/main/docs/STATUS.md
    about: >-
      docs/STATUS.md records what is verified, what is only implemented, and
      every trap found so far. A surprising number of questions are answered
      there, especially the battery and controller-selection ones.
  - name: usbip-win2 driver problems
    url: https://github.com/vadimgrn/usbip-win2/issues
    about: >-
      Install failures, driver crashes, bugchecks, or anything involving
      usbip2_ude / usbip2_filter belong upstream, not here.
