and the pads go back to being plain Bluetooth controllers; on, enabled pads are bridged again as they are found.",auto_bridge_new:"A DualSense this app has never seen is bridged the moment it pairs. Off, a new pad waits until you enable it here or in the tray.",hide_bluetooth_default:"What a NEW controller's 'hide' switch starts as: hide its Bluetooth pad from games and Steam while it is bridged, so only the virtual wired pad is seen (no doubled controller). Existing pads keep their own switch below.",ctrl_enabled:"Bridge this controller: run a virtual wired pad for it whenever it is connected. Off, the pad stays a plain Bluetooth controller.",ctrl_hide:"Hide this controller's Bluetooth pad (HidHide) while it is bridged, so games and Steam see only the virtual wired one. The pill beside it says whether the hide is actually in effect right now.",autostart_on_login:"Start the tray with Windows. Installed as a service it starts before anyone signs in (the pads work on the lock screen too); installed as a scheduled task it starts at sign-in. The installer chooses which; this switch turns whichever is installed on or off.",update_check:"Look for a newer release on GitHub once a day and when the tray starts. Off, nothing is ever fetched.",update_auto_install:"Install a newer release on its own: a short while after one is found, the silent installer runs and the tray (or service) restarts itself, with a toast under the 'update' notification. Off, a new release is only announced and installed by hand -- the Install button here or the tray's 'Install update' row.",tray_actions:"The same commands as the tray menu. Rescan looks for pads again right now; Unhide all lifts every HidHide cloak (a rescue when a pad stays invisible after a crash); Open logs opens the log folder.",notifications_enabled:"Master switch for every toast this app shows. Off, nothing pops up -- including the battery toast shortcut.",n_battery_low:"Warn when a pad's battery runs low (the lightbar flashes too, see Battery).",n_remote_mode:"'Remote mode on / off (<pad>)' whenever a pad switches between driving the game and driving the OS.",n_keyboard:"'On-screen keyboard opened / closed' when the pad-driven keyboard comes and goes. Off by default: it is visible on screen anyway.",n_connection:"'Controller connected / bridged / disconnected' as pads come and go.",n_hide:"When a pad's Bluetooth device is hidden from other apps or made visible again.",n_update:"When a newer release is found (and, with auto-install on, when it is about to be installed).",show_battery:"The 'Battery toast' action (show_battery) is a shortcut you can bind to any chord or remote-mode row: pressing it shows '<pad>: NN % (discharging | charging | full)' for the pad that pressed it. It obeys only the master switch above. By default it sits on R3 while chording.",macro_repeat:"Once per press fires the macro each time the chord lands. While held fires it again every interval for as long as the button stays down. Toggle starts repeating on one press and stops on the next (leaving remote mode or turning the engine off stops it too). Max runs caps a hold/toggle run; 0 is unlimited.",enabled:"Master switch for the whole shortcut engine. Off, the pad is a plain bridged controller: no chords, no gestures, no remote mode, no idle off-timer, no battery flashes.",chord_button:"Hold this button to arm shortcuts: while it is held, other buttons fire their bound actions instead of reaching the game (sticks and triggers still pass -- your aim is never frozen). A quick plain tap is replayed to the game afterwards, so a normal PS press still opens the game's own menu.",double_press_ms:"Two presses of the chord button within this window toggle remote mode instead of replaying a tap to the game.",tap_replay_ms:"When the chord button is tapped on its own, the press is replayed to the game and held down for this long. The game gets a slightly late press; menus do not care.",repeat_ms:"While a chord stays held, repeatable actions (volume, brightness) fire again this often.",haptic_ack:"A short rumble pulse whenever a chord is accepted, so you know it landed without looking at the screen.",haptic_strength:"How strong the acknowledgement rumble is. 0 is silent, 100 is full motor.",stick_mouse_in_chord:"While the chord button is held, the left stick moves the mouse pointer -- a quick nudge-and-click without switching into remote mode.",off_timer_minutes:"Minutes without any pad activity before the pad powers itself off to save its battery (the same mechanism as the PS+Triangle chord). 0 disables the timer.",chords:"Fires while the chord button is held; the game sees none of these presses. Diagonal d-pad counts as both directions.",touch_tap_2f:"Two fingers, a short touch, no click. Right click by default in remote mode.",touch_click_2f:"A physical click of the touchpad while two fingers are resting on it. A two-finger contact that ends as a click never also counts as a tap.",touch_slide_horizontal:"Slide two fingers left or right across the touchpad without pressing it. Bound to a scroll action the wheel follows the fingers like a precision touchpad; bound to alt_tab, it opens the window switcher and steps through it as you slide; lift to switch.",touch_slide_vertical:"Slide two fingers up or down the touchpad without pressing it. Scrolls by default, proportional to the movement (Remote mode's scroll speed applies).",touch_swipe_up:"A quick two-finger flick up, pad not pressed. Kept for older configs: unbound by default now that the vertical slide scrolls.",touch_swipe_down:"A quick two-finger flick down, pad not pressed. Kept for older configs: unbound by default now that the vertical slide scrolls.",touch_pinch:"Two fingers moving apart or together, pad not pressed. Pinch zoom by default: a touch-injected pinch that zooms the page the way a precision touchpad does (the visual viewport, not the browser's zoom level).",touch_slide_horizontal_pressed:"Click the touchpad and, keeping
